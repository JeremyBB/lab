<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Lab — prototypes</title>
<style>
  :root { --bg:#0b0b0f; --card:#16161d; --line:#26262f; --fg:#f2f2f5; --mute:#8a8a99; --acc:#7c5cff; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100dvh; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,sans-serif;
         padding: calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px); }
  h1 { font-size:32px; letter-spacing:-.02em; }
  p.sub { color:var(--mute); margin:4px 0 28px; }
  ul { list-style:none; padding:0; display:grid; gap:12px; }
  a.card { display:flex; align-items:center; justify-content:space-between; min-height:64px;
           padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:16px;
           color:inherit; text-decoration:none; transition:transform .15s, border-color .15s; }
  a.card:active { transform:scale(.98); border-color:var(--acc); }
  .empty { color:var(--mute); padding:24px 18px; border:1px dashed var(--line); border-radius:16px; text-align:center; }
</style>
</head>
<body>
  <h1>Lab</h1>
  <p class="sub">Prototypes mobile-first, codés depuis Discord.</p>
  <ul id="protos">
    <!-- PROTOS -->
    <li><a class="card" href="caisse/"><span><strong>Caisse</strong><br><small style="color:var(--mute)">Plan de salle, commande, encaissement · iPad + iPhone</small></span><span>→</span></a></li>
    <li><a class="card" href="caisse360/"><span><strong>Caisse 360</strong><br><small style="color:var(--mute)">Le téléphone, poste de pilotage du resto</small></span><span>→</span></a></li>
    <li><a class="card" href="bilan/"><span><strong>Bilan permanent</strong><br><small style="color:var(--mute)">EBE prévisionnel au jour le jour · restaurant</small></span><span>→</span></a></li>
  </ul>
</body>
</html>
